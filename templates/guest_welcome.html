<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to TRACE</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f4f7f6;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .welcome-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }
        .logo-text {
            font-weight: bold;
            font-size: 2.5rem;
            color: #2d3436;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        h2 { color: #00b894; margin-bottom: 20px; }
        p { color: #636e72; line-height: 1.6; font-size: 1.1rem; }
        .btn-logout {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 25px;
            background-color: #ff7675;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: 0.3s;
        }
        .btn-logout:hover { background-color: #d63031; }
    </style>
</head>
<body>

    <div class="welcome-card">
        <div class="logo-text">TRACE</div>
        <h2>Hello, {{ current_user.name }}!</h2>
        
        <p>
            You are currently logged in as a <strong>Guest</strong>. 
        </p>
        <p>
            To view your session logs, please click the <strong>specific link</strong> provided to you by your collegue, friend, instructor or trainer.
        </p>
        
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        
        <p style="font-size: 0.9rem;">
            Not expecting to be here? 
        </p>
        <a href="{{ url_for('logout') }}" class="btn-logout">Logout</a>
    </div>

</body>
</html>
