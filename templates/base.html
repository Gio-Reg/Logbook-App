<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRACE | The Journey is the Destination</title>
    
    <!-- Use the black-background icon for Home Screens -->
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='trace_icon.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
	:root{--accent:#ffd700;--bg:#000000;--border:#333}
	body{margin:0;padding:0;background:var(--bg) url("{{ url_for('static', filename='bg_texture.jpg') }}") no-repeat center center fixed;background-size:cover;color:#e0e0e0;font-family:'Inter',sans-serif}
	body::before{content:"";position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:-1}

	.main-wrapper{position:relative;max-width:800px;margin:0 auto;padding:20px 20px}
	
	.brand-header{position:relative;text-align:center;margin-bottom:30px;min-height:80px;padding-top:10px}
	/* Desktop Logo Placement */
	.logo-link{position:absolute;left:0;top:-10px} 
	.logo-img{height:120px;width:auto;object-fit:contain}
	
	@media (max-width: 600px) {
		.main-wrapper{padding: 20px 20px}
		.logo-link { top:-10px; left:-10px } 
		.logo-img { height:75px!important } 
		/* padding-top creates the 'breathing room' at the top of the screen */
		.brand-header { padding-top:40px; margin-bottom:20px } 
		.brand-logo { font-size:1.8rem!important; margin-top:5px }
	}
	
	.brand-logo{color:var(--accent);font-weight:900;letter-spacing:4px;margin:0;font-size:2.2rem;text-transform:uppercase;text-shadow:2px 2px 4px rgba(0,0,0,0.5)}
	.tagline{font-size:0.85rem;font-style:italic;color:#888;letter-spacing:1px;margin-top:5px}
	.logout-btn{display:inline-block;margin-top:10px;color:#eee;text-decoration:none;font-size:0.65rem;border:1px solid #444;padding:4px 12px;border-radius:15px;text-transform:uppercase;letter-spacing:1px;transition:0.3s;background:rgba(0,0,0,0.3)}
	.logout-btn:hover{color:var(--accent);border-color:var(--accent);background:rgba(255,215,0,0.05)}
	</style>
</head>
<body>
    <div class="main-wrapper">
        <header class="brand-header">
			<!-- App Header Logo (Transparent) -->
			<a href="{{ url_for('index') }}" class="logo-link">
				<img src="{{ url_for('static', filename='trace_logo.png') }}" alt="Logo" class="logo-img">
			</a>

			<h1 class="brand-logo">TRACE</h1>
			<p class="tagline">The Journey is the Destination</p>
			
			<nav style="margin-top: 15px;">				
				{% if current_user.is_authenticated and current_user.is_admin %}
					<a href="{{ url_for('admin_approve') }}" style="color:var(--accent);text-decoration:none;margin:0 10px;font-size:0.8rem;border:1px solid var(--accent);padding:4px 8px;border-radius:4px;background:rgba(0,0,0,0.3)">
						USER MANAGEMENT
					</a>
				{% endif %}

				{% if current_user.is_authenticated %}
					<a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
				{% endif %}
			</nav>
		</header>
        {% block content %}{% endblock %}
    </div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}")
        .then(reg => console.log('TRACE Service Worker registered!'))
        .catch(err => console.log('Service Worker failed:', err));
    });
  }
</script>
</body>
</html>
